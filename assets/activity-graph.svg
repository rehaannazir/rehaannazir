<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" width="900" height="195" fill="none" role="img" aria-label="Contribution activity for rehaannazir, including private repositories">
  <defs>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .ttl{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#EDEDF2;letter-spacing:2px}
      .sub{font:500 10px ui-monospace,Consolas,monospace;fill:#5A5468}
      .mo{font:500 9.5px ui-monospace,Consolas,monospace;fill:#4A4458}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      .live{animation:pulse 1.8s ease-in-out infinite}
      @keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
      .line{stroke-dasharray:1200;animation:draw 2.2s ease-out forwards}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      .area{animation:fadeIn 1.6s ease-out .4s both}
      @keyframes dotPulse{0%,100%{r:4;opacity:1}50%{r:7;opacity:.4}}
      .endDot{animation:dotPulse 2.2s ease-in-out infinite}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="193" rx="14" fill="#000000" stroke="#17141C"/>

  <circle class="live" cx="22" cy="24" r="3" fill="#A855F7"/>
  <text x="32" y="28" class="ttl">ACTIVITY</text>
  <text x="878" y="28" text-anchor="end" class="sub">public + private · 12 months</text>
  <line x1="20" y1="38" x2="880" y2="38" stroke="#17141C"/>

